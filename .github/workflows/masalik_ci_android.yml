name: MASALIK native Android
on:
  push:
    branches: [main, 'feat/masalik-native-offline-complete']
    tags: ['masalik-test-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: masalik-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: '4.6.3'
jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Generate bundled original audio
        run: python3 Masalik-3D/tools/generate_audio.py
      - name: Editor import
        run: |
          mkdir -p build/android
          godot --headless --path Masalik-3D --editor --import 2>&1 | tee build/import.log
          ! grep -E 'SCRIPT ERROR|^ERROR:' build/import.log
      - name: Integration and Jolt physics tests
        run: |
          XDG_DATA_HOME=/tmp/masalik-test timeout 120 godot --headless --path Masalik-3D --fixed-fps 60 res://tests/headless_test_runner.tscn 2>&1 | tee build/tests.log
          grep 'failures=0' build/tests.log
          ! grep -E 'SCRIPT ERROR|^ERROR:' build/tests.log
      - name: Continuous real-physics route drive
        run: |
          XDG_DATA_HOME=/tmp/masalik-drive timeout 180 godot --headless --path Masalik-3D --fixed-fps 60 res://tests/road_drive.tscn 2>&1 | tee build/road-drive.log
          grep 'ROAD_DRIVE PASS' build/road-drive.log
          ! grep -E 'SCRIPT ERROR|^ERROR:' build/road-drive.log
      - name: Native UI smoke test
        run: |
          XDG_DATA_HOME=/tmp/masalik-ui timeout 120 godot --headless --path Masalik-3D --fixed-fps 60 res://tests/ui_smoke.tscn 2>&1 | tee build/ui-tests.log
          grep "UI SMOKE FINISHED" build/ui-tests.log
          ! grep -E 'SCRIPT ERROR|^ERROR:' build/ui-tests.log
      - uses: actions/cache@v4
        with:
          path: ~/.android/masalik-debug.keystore
          key: masalik-debug-signing-v1
      - name: Configure Android editor paths
        run: |
          mkdir -p ~/.config/godot ~/.android
          test -f ~/.android/masalik-debug.keystore || keytool -genkeypair -keystore ~/.android/masalik-debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > ~/.config/godot/editor_settings-4.6.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/masalik-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
      - name: Set increasing test build version code
        run: python3 Masalik-3D/tools/set_android_version.py "$((10000 + GITHUB_RUN_NUMBER))"
      - name: Export native ARM64 test APK
        run: |
          godot --headless --path Masalik-3D --install-android-build-template --export-debug 'Android ARM64' ../build/android/MASALIK-1.0.0-dev-arm64.apk 2>&1 | tee build/export.log
          test -s build/android/MASALIK-1.0.0-dev-arm64.apk
      - name: Verify APK identity, permissions, SDK and signature
        run: |
          APK=build/android/MASALIK-1.0.0-dev-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build/android/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee build/android/badging.txt
          grep "package: name='com.moataz.masalik'" build/android/badging.txt
          grep "sdkVersion:'26'" build/android/badging.txt
          grep "native-code: 'arm64-v8a'" build/android/badging.txt
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep android.permission.INTERNET
          sha256sum "$APK" | tee build/android/SHA256SUMS
      - name: Render actual desktop runtime evidence
        run: |
          XDG_DATA_HOME=/tmp/masalik-render xvfb-run -a godot --path Masalik-3D res://scenes/main/main_game.tscn --audio-driver Dummy -- --capture
          find /tmp/masalik-render -name masalik-runtime.png -exec cp {} build/android/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MASALIK-native-ARM64-test-build
          path: |
            build/android/
            build/*.log
      - name: Publish verified test build only
        if: success() && (github.ref == 'refs/heads/feat/masalik-native-offline-complete' || startsWith(github.ref, 'refs/tags/masalik-test-'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="masalik-test-1.0.0-dev-${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          gh release create "$TAG" build/android/* --target "$GITHUB_SHA" --prerelease --title 'MASALIK native test build' --notes 'Native offline Godot ARM64 development APK. Debug signed. Desktop/headless checks only; physical Android first-launch airplane-mode and 30-minute performance acceptance remain pending. Not final 1.0.0 acceptance.'
